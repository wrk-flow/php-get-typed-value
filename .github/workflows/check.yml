name: "Code check"

on:
  workflow_call:
  push:
    branches:
      - "main"

  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "ecs.php"
      - "rector.php"
      - "phpstan.neon"
      - "phpunit.xml"

concurrency:
  group: php-get-typed-value-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: "Code check"
    uses: wrk-flow/reusable-workflows/.github/workflows/php-check.yml@58c3f7a1c34e52cb29ec9217b56ad7e26bb44e28
    with:
      phpVersion: "8.5"
    secrets: inherit

  tests:
    name: "Run tests"
    strategy:
      matrix:
        phpVersion: [ "8.3", "8.4", "8.5" ]
    uses: wrk-flow/reusable-workflows/.github/workflows/php-tests.yml@58c3f7a1c34e52cb29ec9217b56ad7e26bb44e28
    with:
      gistID: ${{ vars.GIST_ID }}
      gistOnPhpVersion: "8.5"
      phpVersion: "${{ matrix.phpVersion }}"
    secrets: inherit

  tests_no_frameworks:
    name: "Run tests without Frameworks"
    strategy:
      matrix:
        phpVersion: [ "8.3", "8.4", "8.5" ]
    uses: wrk-flow/reusable-workflows/.github/workflows/php-tests.yml@58c3f7a1c34e52cb29ec9217b56ad7e26bb44e28
    with:
      phpVersion: "${{ matrix.phpVersion }}"
      composerRemove: "--dev laravel/framework orchestra/testbench"
      dirsRemove: "tests/Laravel"
